# Host config for coverage-tool
# https://github.com/KhwarizmiAnalytix/coverage-tool

[coverage]
filter = "."
source_folder = "."
output_format = "html-and-json"
coverage_report_dir = "coverage_report"
# Without this, coverage-tool's discover_modules() treats every immediate
# source subdirectory as its own "module", each expected to have its own
# lib<module>.* + <module>CxxTests binary (XSigma's per-module convention).
# Memory builds one flat libMemory.* + MemoryCxxTests. The GCC/lcov backend
# ignores `modules` (whole-build-dir capture); the Clang/LLVM path (macOS CI)
# uses it to find the library and test executable.
modules = ["Memory"]

[coverage.exclude]
patterns = [
    "*ThirdParty*",
    "*Testing*",
    "/usr/*",
]
llvm_ignore_regex = [
    ".*Testing[/\\\\].*",
    ".*ThirdParty[/\\\\].*",
]
