name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux CPU: gcc + clang, Release; one Debug canary per compiler.
  # MEMORY_GPU_BACKEND=none exercises the CPU allocator paths only.
  # ---------------------------------------------------------------------------
  linux-cpu:
    name: Linux CPU / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release]
        include:
          - compiler: gcc
            build_type: Debug
          - compiler: clang
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMEMORY_GPU_BACKEND=none
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Linux CUDA: builds and runs the Memory test suite against a real CUDA
  # device. Requires a self-hosted runner with the CUDA toolkit and an
  # NVIDIA GPU (labels: self-hosted, linux, gpu, cuda).
  # Skipped unless the repository variable MEMORY_GPU_RUNNERS is 'true': with
  # no matching runner registered the job would sit queued indefinitely and
  # keep the whole CI run from completing.
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: Linux GPU / CUDA
    if: vars.MEMORY_GPU_RUNNERS == 'true'
    runs-on: [self-hosted, linux, gpu, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify CUDA device is visible
        run: nvidia-smi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORY_GPU_BACKEND=cuda
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Linux HIP: builds and runs the Memory test suite against a real ROCm
  # device. HIP is Unix-only in this project (see Cmake/hip.cmake). Requires
  # a self-hosted runner with ROCm/hipcc and an AMD GPU
  # (labels: self-hosted, linux, gpu, rocm). Gated on MEMORY_GPU_RUNNERS like
  # linux-cuda above.
  # ---------------------------------------------------------------------------
  linux-hip:
    name: Linux GPU / HIP
    if: vars.MEMORY_GPU_RUNNERS == 'true'
    runs-on: [self-hosted, linux, gpu, rocm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify ROCm device is visible
        run: rocm-smi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORY_GPU_BACKEND=hip
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # macOS CPU: AppleClang, Release. Metal is the GPU backend on this
  # platform but stays out of the default CPU/CUDA/HIP CI focus.
  # ---------------------------------------------------------------------------
  macos-cpu:
    name: macOS CPU
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORY_GPU_BACKEND=none
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows CPU: MSVC, Release. HIP is Unix-only and CUDA-on-Windows is not
  # part of the self-hosted GPU fleet, so Windows stays CPU-only here.
  # ---------------------------------------------------------------------------
  windows-cpu:
    name: Windows CPU
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DMEMORY_GPU_BACKEND=none
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # ---------------------------------------------------------------------------
  # Bazel: builds/tests the whole tree (CPU-only default backend), cross-platform.
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'WORKSPACE.bazel', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang ASan and UBSan, CPU backend, Debug.
  # Linux + macOS only — Cmake/sanitize.cmake requires Clang/GCC and explicitly
  # warns "Sanitizers require GCC or Clang" for MSVC, so Windows is skipped
  # (unsupported by the codebase's own sanitizer module, not a CI gap).
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMEMORY_GPU_BACKEND=none
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=OFF
          -DMEMORY_ENABLE_SANITIZER=ON
          -DMEMORY_SANITIZER_TYPE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:allocator_may_return_null=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/Scripts/suppressions/lsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only. CPU backend only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMEMORY_GPU_BACKEND=none
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=OFF
          -DMEMORY_ENABLE_COVERAGE=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -S . -B build
          -DMEMORY_GPU_BACKEND=none
          -DMEMORY_ENABLE_TESTING=ON
          -DMEMORY_ENABLE_BENCHMARK=OFF
          -DMEMORY_ENABLE_COVERAGE=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
