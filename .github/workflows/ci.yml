name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux CPU: gcc + clang, Release; one Debug canary per compiler.
  # MEMORY_GPU_BACKEND=none exercises the CPU allocator paths only.
  # ---------------------------------------------------------------------------
  linux-cpu:
    name: Linux CPU / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release]
        include:
          - compiler: gcc
            build_type: Debug
          - compiler: clang
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=${{ matrix.build_type }}
          --gpu-backend=none
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Linux CPU allocators. Every flag the Linux build can honor:
  #   tbb            — mimalloc off so allocate() uses tbbmalloc
  #   native         — mimalloc and TBB off: malloc / posix_memalign
  #   mimalloc-stats — mimalloc on, MI_STATS=1
  #   numa           — libnuma, MEMORY_HAS_NUMA=1 (Linux only)
  #   memkind        — MEMORY_HAS_MEMKIND=1 (forced off on macOS and Windows)
  #   profiler       — installed Profiler, MEMORY_ENABLE_PROFILER=ON
  # macOS and Windows run the subset those platforms accept in their own
  # jobs. Coverage from each Linux leg is uploaded. libtbb-dev supplies
  # TBB::tbbmalloc. MEMORY_ENABLE_EXTERNAL stays OFF so the stats leg
  # compiles ThirdParty/mimalloc with MI_STATS=1.
  # ---------------------------------------------------------------------------
  linux-allocators:
    name: Linux allocators / ${{ matrix.allocator }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        allocator: [tbb, native, mimalloc-stats, numa, memkind, profiler]
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          packages=(ninja-build lcov)
          case "${{ matrix.allocator }}" in
            tbb) packages+=(libtbb-dev) ;;
            numa) packages+=(libnuma-dev) ;;
          esac
          sudo apt-get install -y "${packages[@]}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Checkout Profiler
        if: matrix.allocator == 'profiler'
        uses: actions/checkout@v4
        with:
          repository: KhwarizmiAnalytix/Profiler
          path: profiler
          submodules: recursive

      - name: Build and install Profiler
        if: matrix.allocator == 'profiler'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir profiler --build-dir profiler_build --generator Ninja
          --build-type=Release
          --install-prefix=${{ github.workspace }}/profiler_install
          --profiler-gpu-backend=none
          --profiler-testing=OFF
          --profiler-examples=OFF
          --profiler-benchmark=OFF
          --profiler-install=ON
          --shared=OFF
          --position-independent-code=ON
          && python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir profiler_build
          && python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir profiler_build

      - name: Configure
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: |
          set -euo pipefail
          extra=()
          case "$ALLOCATOR" in
            tbb)
              extra+=(
                --mimalloc=OFF
                --tbb=ON
                --mimalloc-stats=OFF
              )
              ;;
            native)
              extra+=(
                --mimalloc=OFF
                --tbb=OFF
                --mimalloc-stats=OFF
              )
              ;;
            mimalloc-stats)
              extra+=(
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=ON
              )
              ;;
            numa)
              extra+=(
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=OFF
                --numa=ON
              )
              ;;
            memkind)
              extra+=(
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=OFF
                --memkind=ON
              )
              ;;
            profiler)
              extra+=(
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=OFF
                --profiler=ON
                --prefix-path="${{ github.workspace }}/profiler_install"
              )
              ;;
            *)
              echo "unknown allocator: $ALLOCATOR" >&2
              exit 1
              ;;
          esac
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja \
            --build-type=Debug \
            --gpu-backend=none \
            --testing=ON \
            --benchmark=OFF \
            --coverage=ON \
            --external=OFF \
            "${extra[@]}" 2>&1 | tee configure.log

      - name: Verify allocator configuration
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: |
          python3 -m unittest discover -s Testing/CMake -p 'test_verify_allocator_config.py' -v
          python3 Scripts/verify_allocator_config.py configure.log build

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Collect coverage
        run: coverage-tool --build=build --compiler=gcc

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS allocators: TBB, native malloc, mimalloc stats, Metal, and Profiler.
  # NUMA and memkind are forced off on Apple. Starts after the sanitizers so
  # it does not join the initial macos-latest burst (the hosted cap is 5).
  # ---------------------------------------------------------------------------
  macos-allocators:
    name: macOS allocators / ${{ matrix.allocator }}
    needs: sanitize
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        allocator: [tbb, native, mimalloc-stats, metal, profiler]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install ninja
          if [ "${{ matrix.allocator }}" = "tbb" ]; then
            brew install tbb
          fi

      - name: Checkout Profiler
        if: matrix.allocator == 'profiler'
        uses: actions/checkout@v4
        with:
          repository: KhwarizmiAnalytix/Profiler
          path: profiler
          submodules: recursive

      - name: Build and install Profiler
        if: matrix.allocator == 'profiler'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir profiler --build-dir profiler_build --generator Ninja
          --build-type=Release
          --install-prefix=${{ github.workspace }}/profiler_install
          --profiler-gpu-backend=none
          --profiler-testing=OFF
          --profiler-examples=OFF
          --profiler-benchmark=OFF
          --profiler-install=ON
          --shared=OFF
          --position-independent-code=ON
          && python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir profiler_build
          && python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir profiler_build

      - name: Configure
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: |
          set -euo pipefail
          extra=()
          case "$ALLOCATOR" in
            tbb)
              extra+=(
                --mimalloc=OFF
                --tbb=ON
                --mimalloc-stats=OFF
                --prefix-path="$(brew --prefix tbb)"
              )
              ;;
            native)
              extra+=(
                --mimalloc=OFF
                --tbb=OFF
                --mimalloc-stats=OFF
              )
              ;;
            mimalloc-stats)
              extra+=(
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=ON
              )
              ;;
            metal)
              extra+=(
                --gpu-backend=metal
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=OFF
              )
              ;;
            profiler)
              extra+=(
                --mimalloc=ON
                --tbb=OFF
                --mimalloc-stats=OFF
                --profiler=ON
                --prefix-path="${{ github.workspace }}/profiler_install"
              )
              ;;
            *)
              echo "unknown allocator: $ALLOCATOR" >&2
              exit 1
              ;;
          esac
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja \
            --build-type=Release \
            --gpu-backend=none \
            --testing=ON \
            --benchmark=ON \
            --external=OFF \
            "${extra[@]}" 2>&1 | tee configure.log

      - name: Verify allocator configuration
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: python3 Scripts/verify_allocator_config.py configure.log build

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Windows allocators: TBB (built from source when no system TBB is
  # installed), native _aligned_malloc, and mimalloc stats. NUMA, memkind,
  # HIP, and Metal are not Windows configurations.
  # ---------------------------------------------------------------------------
  windows-allocators:
    name: Windows allocators / ${{ matrix.allocator }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        allocator: [tbb, native, mimalloc-stats]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: |
          $extra = @()
          if ($env:ALLOCATOR -eq "tbb") {
            $extra = @(
              "--mimalloc=OFF",
              "--tbb=ON",
              "--mimalloc-stats=OFF"
            )
          } elseif ($env:ALLOCATOR -eq "native") {
            $extra = @(
              "--mimalloc=OFF",
              "--tbb=OFF",
              "--mimalloc-stats=OFF"
            )
          } elseif ($env:ALLOCATOR -eq "mimalloc-stats") {
            $extra = @(
              "--mimalloc=ON",
              "--tbb=OFF",
              "--mimalloc-stats=ON"
            )
          } else {
            Write-Error "unknown allocator: $env:ALLOCATOR"
            exit 1
          }
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build `
            --gpu-backend=none `
            --testing=ON `
            --benchmark=ON `
            --external=OFF `
            @extra *> configure.log
          if ($LASTEXITCODE -ne 0) { Get-Content configure.log; exit $LASTEXITCODE }
          Get-Content configure.log

      - name: Verify allocator configuration
        shell: pwsh
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: python Scripts/verify_allocator_config.py configure.log build

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

  # ---------------------------------------------------------------------------
  # Windows Profiler. Linux and macOS enable Profiler inside their allocator
  # matrices. MSVC uses the Visual Studio generator so the compiler
  # environment GitHub already provides is enough. HIP, Metal, NUMA, and
  # memkind stay off.
  # ---------------------------------------------------------------------------
  windows-profiler:
    name: External Profiler / windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Profiler
        uses: actions/checkout@v4
        with:
          repository: KhwarizmiAnalytix/Profiler
          path: profiler
          submodules: recursive

      - name: Build and install Profiler
        shell: pwsh
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir profiler --build-dir profiler_build --install-prefix="${{ github.workspace }}/profiler_install" --profiler-gpu-backend=none --profiler-testing=OFF --profiler-examples=OFF --profiler-benchmark=OFF --profiler-install=ON --shared=OFF --position-independent-code=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir profiler_build --build-type Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir profiler_build --build-type Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Memory against the installed Profiler
        shell: pwsh
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build --prefix-path="${{ github.workspace }}/profiler_install" --gpu-backend=none --profiler=ON --testing=ON --benchmark=ON *> configure.log
          if ($LASTEXITCODE -ne 0) { Get-Content configure.log; exit $LASTEXITCODE }
          Get-Content configure.log

      - name: Verify the external Profiler was actually used
        shell: pwsh
        run: |
          if (-not (Select-String -Path configure.log -Pattern 'Memory: using Profiler::Profiler \(find_package\)' -Quiet)) {
            Write-Error "Profiler was not found via find_package"
            exit 1
          }

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

  # ---------------------------------------------------------------------------
  # Linux CUDA: builds and runs the Memory test suite against a real CUDA
  # device. Requires a self-hosted runner with the CUDA toolkit and an
  # NVIDIA GPU (labels: self-hosted, linux, gpu, cuda).
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: Linux GPU / CUDA
    if: vars.GPU_RUNNERS_AVAILABLE == 'true'
    runs-on: [self-hosted, linux, gpu, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify CUDA device is visible
        run: nvidia-smi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --gpu-backend=cuda
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --verbose

  # ---------------------------------------------------------------------------
  # Linux HIP: builds and runs the Memory test suite against a real ROCm
  # device. HIP is Unix-only in this project (see Cmake/hip.cmake). Requires
  # a self-hosted runner with ROCm/hipcc and an AMD GPU
  # (labels: self-hosted, linux, gpu, rocm).
  # ---------------------------------------------------------------------------
  linux-hip:
    name: Linux GPU / HIP
    if: vars.GPU_RUNNERS_AVAILABLE == 'true'
    runs-on: [self-hosted, linux, gpu, rocm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify ROCm device is visible
        run: rocm-smi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --gpu-backend=hip
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --verbose

  # ---------------------------------------------------------------------------
  # macOS CPU: AppleClang, Release. Metal is the GPU backend on this
  # platform but stays out of the default CPU/CUDA/HIP CI focus.
  # ---------------------------------------------------------------------------
  macos-cpu:
    name: macOS CPU
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --gpu-backend=none
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Windows CPU: MSVC, Release. HIP is Unix-only and CUDA-on-Windows is not
  # part of the self-hosted GPU fleet, so Windows stays CPU-only here.
  # ---------------------------------------------------------------------------
  windows-cpu:
    name: Windows CPU
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --gpu-backend=none
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

  # ---------------------------------------------------------------------------
  # Compiler cache & Icecc: exercises MEMORY_ENABLE_CACHE / MEMORY_CACHE_BACKEND
  # (ccache, sccache, buildcache) and MEMORY_ENABLE_ICECC across Linux, macOS,
  # and Windows. Icecream has no Windows port, so there is no windows-icecc leg.
  # ICECC=no forces the icecc launcher to fall back to local compilation instead
  # of requiring a scheduler/cluster.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: Cache & Icecc / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
            icecc: "OFF"
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
            icecc: "OFF"
          - name: linux-icecc
            os: ubuntu-latest
            backend: none
            icecc: "ON"
          - name: macos-ccache
            os: macos-latest
            backend: ccache
            icecc: "OFF"
          - name: macos-sccache
            os: macos-latest
            backend: sccache
            icecc: "OFF"
          - name: macos-icecc
            os: macos-latest
            backend: none
            icecc: "ON"
          - name: windows-ccache
            os: windows-latest
            backend: ccache
            icecc: "OFF"
          - name: windows-sccache
            os: windows-latest
            backend: sccache
            icecc: "OFF"
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
            icecc: "OFF"
          - name: macos-buildcache
            os: macos-latest
            backend: buildcache
            icecc: "OFF"
          - name: windows-buildcache
            os: windows-latest
            backend: buildcache
            icecc: "OFF"
    env:
      ICECC: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja, ccache, and icecc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache icecc

      - name: Install Ninja, ccache, and icecc (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'ccache'
        run: choco install -y ccache

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.backend == 'sccache'
        with:
          version: v0.12.0

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          BACKEND: ${{ matrix.backend }}
          USE_ICECC: ${{ matrix.icecc }}
        run: |
          set -euo pipefail
          extra=(--icecc="$USE_ICECC")
          if [ "$BACKEND" != "none" ]; then
            extra+=(--cache=ON --cache-backend="$BACKEND")
          fi
          # Release defaults to LTO, which Memory rejects with sccache.
          if [ "$BACKEND" = "sccache" ]; then
            extra+=(--lto-mode=off)
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja \
            --build-type=Release \
            --gpu-backend=none \
            --testing=ON \
            --benchmark=OFF \
            "${extra[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          $extra = @()
          if ($env:BACKEND -ne "none") {
            $extra = @("--cache=ON", "--cache-backend=$env:BACKEND")
          }
          if ($env:BACKEND -eq "sccache") {
            $extra += "--lto-mode=off"
          }
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build `
            --gpu-backend=none `
            --testing=ON `
            --benchmark=OFF `
            @extra

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

  # ---------------------------------------------------------------------------
  # Bazel: builds/tests the whole tree (CPU-only default backend), cross-platform.
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'WORKSPACE.bazel', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build --compiler=default --compilation-mode=fastbuild --target=//...

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test --compiler=default --compilation-mode=fastbuild --target=//... --test-output=errors

  # ---------------------------------------------------------------------------
  # Bazel GPU: same build/test coverage as CPU, on the existing GPU fleet.
  # CUDA requires the toolkit (CUDA_PATH/CUDA_HOME or /usr/local/cuda);
  # HIP requires ROCm (ROCM_PATH/HIP_PATH or /opt/rocm).
  # ---------------------------------------------------------------------------
  bazel-gpu:
    name: Bazel / Linux / ${{ matrix.backend }}
    if: vars.GPU_RUNNERS_AVAILABLE == 'true'
    runs-on: [self-hosted, linux, gpu, '${{ matrix.runner_label }}']
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            runner_label: cuda
          - backend: hip
            runner_label: rocm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ matrix.backend }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'BUILD.bazel', 'bazel/**') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.backend }}-

      - name: Verify CUDA device is visible
        if: matrix.backend == 'cuda'
        run: nvidia-smi

      - name: Verify ROCm device is visible
        if: matrix.backend == 'hip'
        run: rocm-smi

      - name: Build
        run: >
          python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build
          --compiler=default --compilation-mode=fastbuild --target=//...
          --gpu-backend=${{ matrix.backend }}

      - name: Test
        run: >
          python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test
          --compiler=default --compilation-mode=fastbuild --target=//...
          --gpu-backend=${{ matrix.backend }} --test-output=errors

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang, CPU backend, Debug. Types the hosted toolchain can run:
  #   address, undefined, thread — Ubuntu and macOS
  #   leak                       — Ubuntu only (Apple Clang rejects -fsanitize=leak)
  # MemorySanitizer (memory) needs an instrumented C++ standard library, which
  # these runners do not provide, so it stays a local Clang build.
  # Windows is skipped: Cmake/sanitize.cmake requires GCC or Clang.
  #
  # Standard GitHub-hosted plans run at most 5 macOS jobs at once
  # (https://docs.github.com/en/actions/reference/limits). Waiting for macOS
  # CPU keeps the initial macOS requests at 3 (CPU, Bazel, coverage). The
  # three macOS sanitizers start after that. Profiler on macOS runs later,
  # inside macos-allocators. !cancelled() still runs the sanitizers when the
  # macOS CPU job fails.
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    needs: macos-cpu
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined, thread, leak]
        exclude:
          - os: macos-latest
            sanitizer: leak
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --sanitizer=ON
          --sanitizer-types=${{ matrix.sanitizer }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:allocator_may_return_null=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/Scripts/suppressions/lsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Valgrind memcheck. Linux only: MEMORY_ENABLE_VALGRIND turns mimalloc off
  # (mimalloc's reserved address space crashes Valgrind) and ctest --memcheck
  # uses the suppression file and the 20x timeout multiplier. macOS hosted
  # runners have no Valgrind.
  # ---------------------------------------------------------------------------
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --valgrind=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test under Valgrind
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --memcheck

  # ---------------------------------------------------------------------------
  # cppcheck: static analysis of src/ via Scripts/helpers/cppcheck.py.
  # Fails the job on severity "error". Style findings stay in the log.
  # ---------------------------------------------------------------------------
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Analyze
        run: |
          set -euo pipefail
          mkdir -p build
          python3 - <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, "Scripts")
          from helpers.cppcheck import build_cppcheck_command, process_cppcheck_results

          output = "build/cppcheck_output.log"
          command = build_cppcheck_command(".", output)
          print(" ".join(command))
          result = subprocess.run(command, check=False)
          sys.exit(process_cppcheck_results(result, output, verbose=True))
          PY

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only. CPU backend only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --coverage=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --coverage=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
