name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux: gcc + clang, all four backends, Release; one Debug canary per compiler.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.backend }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        backend: [LOGURU, SPDLOG, GLOG, NATIVE]
        build_type: [Release]
        include:
          - compiler: gcc
            backend: LOGURU
            build_type: Debug
          - compiler: clang
            backend: LOGURU
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLOGGING_BACKEND=${{ matrix.backend }}
          -DLOGGING_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # macOS: AppleClang, all four backends, Release.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS / ${{ matrix.backend }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [LOGURU, SPDLOG, GLOG, NATIVE]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLOGGING_BACKEND=${{ matrix.backend }}
          -DLOGGING_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows: MSVC, all four backends, Release.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / ${{ matrix.backend }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [LOGURU, SPDLOG, GLOG, NATIVE]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DLOGGING_BACKEND=${{ matrix.backend }}
          -DLOGGING_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # ---------------------------------------------------------------------------
  # Bazel: builds/tests the whole tree (default LOGURU backend), cross-platform.
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'WORKSPACE.bazel', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang ASan and UBSan, default backend, Debug.
  # Linux + macOS only — Cmake/sanitize.cmake requires Clang/GCC and explicitly
  # warns "Sanitizers require GCC or Clang" for MSVC, so Windows is skipped
  # (unsupported by the codebase's own sanitizer module, not a CI gap).
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLOGGING_BACKEND=LOGURU
          -DLOGGING_ENABLE_BENCHMARK=OFF
          -DLOGGING_ENABLE_SANITIZER=ON
          -DLOGGING_SANITIZER_TYPE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/Scripts/suppressions/lsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLOGGING_BACKEND=LOGURU
          -DLOGGING_ENABLE_BENCHMARK=OFF
          -DLOGGING_ENABLE_COVERAGE=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -S . -B build
          -DLOGGING_BACKEND=LOGURU
          -DLOGGING_ENABLE_BENCHMARK=OFF
          -DLOGGING_ENABLE_COVERAGE=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
